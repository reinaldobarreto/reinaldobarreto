name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # todos os dias às 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - README.md

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: reinaldobarreto
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23F7DF1E&color_dots=%231A1A1A,%233D3A16,%235FA04E,%23C9B916,%23F7DF1E
            dist/snake-light.svg?palette=github-light&color_snake=%23F7DF1E&color_dots=%23FFFCE0,%23F8ED8C,%23C8DDBD,%2388BC77,%235FA04E

      - name: Deploy SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          target_branch: output
          build_dir: dist