name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # todos os dias às 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - README.md

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: reinaldobarreto
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%237B3FFF&color_dots=%236272A4,%235A4F7A,%237C6AB8,%23A78BFA,%23BD93F9
            dist/snake-light.svg?palette=github-light&color_snake=%237B3FFF&color_dots=%23E6E6FA,%23CFC7FF,%23B59CFF,%239B6CFF,%237B3FFF

      - name: Deploy SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          target_branch: output
          build_dir: dist