name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # todos os dias às 00:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: reinaldobarreto
          outputs: |
            dist/snake.svg?color_snake=%2300E5FF&color_dots=%23FFFFFF,%2300E5FF,%23FFC107,%2302569B
            dist/snake-light.svg?color_snake=%2302569B&color_dots=%23000000,%2300E5FF,%23FFC107,%2302569B

      - name: Deploy SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: output
          build_dir: dist