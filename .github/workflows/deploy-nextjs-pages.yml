name: Deploy Next.js (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - projects/nextjs-python-portfolio/**
      - .github/workflows/deploy-nextjs-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: projects/nextjs-python-portfolio
        run: npm install

      - name: Build
        working-directory: projects/nextjs-python-portfolio
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/nextjs-python-portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

